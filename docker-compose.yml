services:
  api:
    build: ../simpleApi
    image: simple-api
    ports:
      - "8080:8080"
    environment:
      - allowedOrigins=http://localhost:4200
      - helloMessage=Hello from the simplest api
    restart: unless-stopped
  front:
    build: ../Canteen
    image: canteen-app
    ports:
      - "4200:4200"
    restart: unless-stopped