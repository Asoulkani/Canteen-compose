apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
spec:
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      initContainers:
        - name: wait-for-api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://api:8080/actuator/health/readiness; do
                echo "waiting for api..."
                sleep 2
              done
      containers:
        - name: front
          image: canteen-app
          imagePullPolicy: Never
          ports:
            - containerPort: 4200
